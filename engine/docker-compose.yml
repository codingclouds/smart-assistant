services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-assistant-engine
    ports:
      - "${ENGINE_PORT:-8080}:8080"
    environment:
      - ADDR=:8080
      - DB_PATH=/app/data/smart-assistant.db
    volumes:
      - engine-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/ws"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  engine-data:
    driver: local